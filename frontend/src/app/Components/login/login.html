<div class="login-wrapper">
  <div class="login-left">
      <mat-card>
          <mat-card-header>
              <h2>Login Admin</h2>
          </mat-card-header>
          <mat-card-content>
              <!-- ngSubmit)="login()" -->
              <form #loginForm="ngForm">
                  <!-- @if (!loginValid) {
                    <mat-error>Incorrect username or password</mat-error>
                  } -->
                  <mat-form-field>
                      <mat-label>Name</mat-label>
                      <!--   [(ngModel)]="user.name"-->
                      <input
                        matInput
                        name="name"
                        required>
                      <mat-icon matSuffix>person</mat-icon>
                  </mat-form-field>
                  <mat-form-field>
                      <mat-label>Password</mat-label>
                      <input
                        matInput
                        name="password"
                        required>
                        <!-- [type]="showPassword ? 'text' : 'password'"
                        matInput
                        [(ngModel)]="user.password" -->
                      <mat-icon matSuffix>lock</mat-icon>
                  </mat-form-field>
                  <div class="boxPasswordCheck">
                    <!-- [(ngModel)]="showPassword" -->
                    <mat-checkbox name="showPassword">
                      <p class="textPass">Show Password</p>
                    </mat-checkbox>
                  </div>
                  <button mat-raised-button color="primary" type="submit" [disabled]="!loginForm.form.valid">Login</button>
              </form>
          </mat-card-content>
      </mat-card>
  </div>
</div>
