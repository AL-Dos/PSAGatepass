<div class="login-wrapper">
  <div class="login-left">
      <div class="section">
          <div class="section-header">
              <h2>Welcome back</h2>
              <p>Sign in to manage gatepasses and equipment activity.</p>
          </div>
          <div class="section-content">
              <form #loginForm="ngForm" (ngSubmit)="login()">
                  <mat-form-field>
                      <mat-label>Name</mat-label>
                      <input
                        matInput
                        name="name"
                        autocomplete="username"
                        [(ngModel)]="user.name"
                        required>
                      <mat-icon matSuffix>person</mat-icon>
                  </mat-form-field>
                  <mat-form-field>
                      <mat-label>Password</mat-label>
                      <input
                        matInput
                        name="password"
                        autocomplete="current-password"
                        [type]="showPassword ? 'text' : 'password'"
                        [(ngModel)]="user.password"
                        required>
                      <mat-icon matSuffix>lock</mat-icon>
                  </mat-form-field>
                  <div class="boxPasswordCheck">
                    <mat-checkbox name="showPassword" [(ngModel)]="showPassword">
                      <p class="textPass">Show Password</p>
                    </mat-checkbox>
                  </div>

                  @if (!loginValid) {
                    <mat-error class="error-message">
                      Invalid name or password. Please try again.
                    </mat-error>
                  }
                  <button mat-raised-button color="primary" type="submit" [disabled]="loading">{{ loading ? 'Signing in...' : 'Sign in' }}</button>
              </form>
          </div>
      </div>
  </div>
</div>
