<div>
    <mat-card>
        <mat-card-header>
            <h2>Logging out?</h2>
        </mat-card-header>
        <mat-card-content>
                <p>Are you sure you want to logout?</p>
                <nav class="button-group">
                <button mat-raised-button color="primary" class=buttons (click)="logout()">Logout</button>
                <button mat-raised-button color="warn" class=buttons (click)="close()">Cancel</button>
                </nav>
        </mat-card-content>
    </mat-card>
</div>
