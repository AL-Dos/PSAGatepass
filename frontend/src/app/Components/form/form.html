<div></div>
<div class="request-form">
  <div class="section">
    <div class="section-header">
      <h2>Requestor Form</h2>
    </div>

    <div class="section-content scrollable-content">
      <form #form="ngForm" (ngSubmit)="submitForm(form)">

        <!-- Name -->
        <mat-form-field>
          <mat-label>Name of Requestor</mat-label>
          <input
            matInput
            name="name"
            [(ngModel)]="model.name"
            required
            #eqCode="ngModel"
            appAutofocusInvalid
          />
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        <!-- Destination -->
        <mat-form-field>
          <mat-label>Destination</mat-label>
          <input
            matInput
            name="destination"
            [(ngModel)]="model.destination"
            required
            #eqCode="ngModel"
            appAutofocusInvalid
          />
          <mat-icon matSuffix>location_on</mat-icon>
        </mat-form-field>

        <!-- Period Covered -->
        <mat-form-field>
          <mat-label>Period Covered</mat-label>
          <input
            matInput
            name="period"
            [(ngModel)]="model.period"
            required
            #eqCode="ngModel"
            appAutofocusInvalid
          />
          <mat-icon matSuffix>calendar_today</mat-icon>
        </mat-form-field>

        <!-- Purpose -->
        <mat-form-field>
          <mat-label>Purpose</mat-label>
          <input
            matInput
            name="purpose"
            [(ngModel)]="model.purpose"
            required
            #eqCode="ngModel"
            appAutofocusInvalid
          />
          <mat-icon matSuffix>calendar_today</mat-icon>
        </mat-form-field>

        <h3 style="margin-top: 20px;">Equipment List</h3>

        <!-- EQUIPMENT REPEATING ROWS -->
        @for (item of model.equipmentItems; let i = $index; track i) {
          <div class="equipment-row">
            <mat-form-field>
              <mat-label>Description</mat-label>
              <input
                matInput
                name="desc{{ i }}"
                [(ngModel)]="item.equipmentName"
                required
                #eqCode="ngModel"
                appAutofocusInvalid
              />
            </mat-form-field>

            <mat-form-field>
              <mat-label>Quantity</mat-label>
              <input
                matInput
                type="number"
                name="qty{{ i }}"
                [(ngModel)]="item.quantity"
                required
                #eqCode="ngModel"
                appAutofocusInvalid
              />
            </mat-form-field>

            <mat-form-field>
              <mat-label>Equipment ID</mat-label>
              <input
                matInput
                name="eqid{{ i }}"
                [(ngModel)]="item.equipmentCode"
                required
                #eqCode="ngModel"
                appAutofocusInvalid
              />
            </mat-form-field>

            <button
              mat-icon-button
              color="warn"
              type="button"
              aria-label="Delete equipment"
              (click)="removeEquipment(i)"
              class="delete-btn"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        }

        <!-- ADD EQUIPMENT BUTTON -->
        <button mat-raised-button color="accent" type="button" (click)="addEquipment()">
          Add Equipment
        </button>

        <div class="button-group">
          <button mat-raised-button color="primary" type="button" (click)="submitForm(form)">Save</button>
          <button mat-stroked-button color="accent" type="reset" (click)="resetForm(form)">Clear</button>
        </div>

      </form>

      @if (showSuccess) {
        <div class="success-message">
          <mat-icon>check_circle</mat-icon>
          Form submitted successfully!
        </div>
      }
    </div>
  </div>
</div>
