<body>
  <p>Gatepass Log Reports</p>

  <div class="table-container">

  <div class="search-bar">
    <mat-form-field appearance="outline">
      <mat-label>Search</mat-label>
      <input matInput placeholder="Search a file">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="table-scroll">
    <table mat-table matSort>
    <!-- Id Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let blank"> </td>
    </ng-container>

    <!-- Equipment -->
    <ng-container matColumnDef="equip">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Description of Property/Equipment </th>
      <td mat-cell *matCellDef="let blank">  </td>
    </ng-container>

    <!-- Property Number -->
    <ng-container matColumnDef="pNum">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Property Number </th>
      <td mat-cell *matCellDef="let blank">  </td>
    </ng-container>

    <!-- Destination -->
    <ng-container matColumnDef="dest">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Destination </th>
      <td mat-cell *matCellDef="let blank">  </td>
    </ng-container>

    <!-- Period Covered -->
    <ng-container matColumnDef="pCover">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Period Covered </th>
      <td mat-cell *matCellDef="let blank"> </td>
    </ng-container>

    <!-- Render rows -->
    <tr mat-header-row *matHeaderRowDef></tr>
    <tr mat-row *matRowDef="let row;"></tr>

    <!-- No data message -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" style="text-align: center; font-style: italic; color: gray;">
        No records found!
      </td>
    </tr>
    </table>
  </div>

  <!-- <mat-paginator [length]="totalItems"
                 [pageSize]="pageSize"
                 [pageIndex]="pageIndex"
                 [pageSizeOptions]="[5, 10, 25, 50]"
                 (page)="onPageChange($event)">
  </mat-paginator> -->
  </div>
</body>
