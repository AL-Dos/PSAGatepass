<body>
  <p>Gatepass Log Reports</p>

  <div class="table-container">

  <div class="search-bar">
    <mat-form-field appearance="outline">
      <mat-label>Search</mat-label>
      <input matInput placeholder="Search a file" (keyup)="applyFilter($event)">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="table-scroll">
    <table mat-table [dataSource]="dataSource" matSort>
    <!-- Id Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="id"> ID </th>
      <td mat-cell *matCellDef="let element"> {{ element.id }} </td>
    </ng-container>

    <!-- Equipment -->
    <ng-container matColumnDef="equip">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="equip"> Description of Property/Equipment </th>
      <td mat-cell *matCellDef="let element">  {{ element.equipmentName }} </td>
    </ng-container>

    <!-- Quantity -->
    <ng-container matColumnDef="quan">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="quan"> Quantity </th>
      <td mat-cell *matCellDef="let element">  {{ element.quantity }} </td>
    </ng-container>

    <!-- Property Number -->
    <ng-container matColumnDef="pNum">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="pNum"> Property Number </th>
      <td mat-cell *matCellDef="let element">  {{ element.equipmentCode }} </td>
    </ng-container>

    <!-- Destination -->
    <ng-container matColumnDef="dest">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="dest"> Destination </th>
      <td mat-cell *matCellDef="let element">  {{ element.destination }} </td>
    </ng-container>

    <!-- Period Covered -->
    <ng-container matColumnDef="pCover">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="pCover"> Period Covered </th>
      <td mat-cell *matCellDef="let element"> {{ element.period }} </td>
    </ng-container>

    <!-- Render rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- No data message -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="displayedColumns.length" style="text-align: center; font-style: italic; color: gray;">
        No records found!
      </td>
    </tr>
    </table>
  </div>

  <mat-paginator [length]="dataSource.data.length"
                 [pageSize]="10"
                 [pageIndex]="0"
                 [pageSizeOptions]="[5, 10, 25, 50]">
  </mat-paginator>
  </div>
</body>
