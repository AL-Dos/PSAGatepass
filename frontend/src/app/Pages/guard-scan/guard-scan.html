<div class="scan-container">
  <mat-card class="scan-card">
    <mat-card-header>
      <mat-card-title>Guard QR Scanner</mat-card-title>
    </mat-card-header>
    <mat-card-content>

      <div [hidden]="scannedToken()">
        <div id="reader" width="100%"></div>
      </div>

      @if (scannedToken()) {
      <div class="pin-form">
        <h3>QR Token Detected</h3>
        <p class="token-display">{{ scannedToken() }}</p>

        @if (result()) {
        <div class="result-box">
             <h2 [class.released]="result()?.action === 'Released'"
                 [class.returned]="result()?.action === 'Returned'">
                 {{ result()?.message }}
             </h2>
             <p>Guard: {{ result()?.guard }}</p>
             <button mat-raised-button color="primary" (click)="resetScan()">Scan Next</button>
        </div>
        }

        @if (!result()) {
        <div>
          <p>Please enter your PIN to authorize:</p>
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Guard PIN</mat-label>
            <input matInput type="password" [(ngModel)]="pin" name="pin" required>
          </mat-form-field>

          <div class="actions">
            <button mat-stroked-button color="warn" (click)="resetScan()">Cancel</button>
            <button mat-raised-button color="primary"
                    [disabled]="!pin() || loading()"
                    (click)="submitPin()">
              {{ loading() ? 'Verifying...' : 'Confirm Action' }}
            </button>
          </div>
        </div>
        }
      </div>
      }

    </mat-card-content>
  </mat-card>
</div>
