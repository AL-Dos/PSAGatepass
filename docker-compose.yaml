services:
  backend:
    build: ./backend
    container_name: backend-gp
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8085:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - transmittal_network

  db:
    image: mysql
    container_name: mysql-gp
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1",
        ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    networks:
      - transmittal_network

  proxy:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nginx-gp-proxy
    ports:
      - "8084:80"
    depends_on:
      - backend
    networks:
      - transmittal_network

volumes:
  db_data:

networks:
  transmittal_network:
    driver: bridge
